# ==============================================================================
# 工业级 Telegram 分布式监控系统 — Docker 部署方案
# 支持 x86_64 / ARM64 架构，内置 Redis 集群模式
# ==============================================================================

version: '3.8'

services:
  # ── 监控 Bot 主服务 ──────────────────────────────────────────────────────
  monitor-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitor-bot:latest
    container_name: monitor-bot
    restart: unless-stopped
    environment:
      - TG_TOKEN=${TG_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-300}
      - MAX_FAILURES=${MAX_FAILURES:-2}
      - CONCURRENT_LIMIT=${CONCURRENT_LIMIT:-10}
      - MAX_RETENTION_DAYS=${MAX_RETENTION_DAYS:-31}
      - REDIS_URL=redis://redis:6379/0
      # 确保文件写入挂载卷路径
      - DB_FILE=/app/data/monitor_history.db
      - LOG_FILE=/app/logs/bot.log
      - DATA_FILE=/app/data/monitored_sites.json
      - SERVICES_FILE=/app/data/monitored_services.json
    volumes:
      # 持久化数据（数据库、日志、配置）
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "pgrep", "-f", "monitor_bot_optimized.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  # ── Redis 缓冲队列（高吞吐场景必需） ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: monitor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 300M

# ── 网络配置 ─────────────────────────────────────────────────────────────────
networks:
  monitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
